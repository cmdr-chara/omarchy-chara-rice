add_newline = true
command_timeout = 500
palette = "chara"
format = "[╭─](frame) $directory$git_branch$git_status$cmd_duration$line_break[╰─](frame)$character"

[palettes.chara]
bone = "#F0E5DF"
crimson = "#F13B45"
gold = "#E9C079"
green = "#9BC28D"
muted = "#95838B"
frame = "#603A40"

[character]
success_symbol = "[ ♥](crimson) [❯](bone)"
error_symbol = "[ ♥](crimson) [✗](crimson)"
vimcmd_symbol = "[ ♥](green) [❮](bone)"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold bone"
read_only_style = "crimson"
truncation_length = 3
truncation_symbol = "…/"
repo_root_style = "bold bone"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[ $branch]($style) "
style = "green"

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "crimson"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = "! "
up_to_date = ""
untracked  = "?${count} "
modified   = "~${count} "
stashed    = ""
staged     = "+${count} "
renamed    = "»${count} "
deleted    = "−${count} "

[cmd_duration]
min_time = 2000
format = "[· $duration]($style) "
style = "muted"
